<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العيادة</title>
<meta name="description" content="إدارة العيادة: الحجز بالواتساب، ملف المريض، الروشتات، الأشعة والتحاليل، الملاحظات الصوتية، متابعة العمليات والكسور، والحسابات.">
<meta name="theme-color" content="#0f2a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="العيادة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Archivo";font-weight:400;font-display:swap;src:url(fonts/archivo-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:500;font-display:swap;src:url(fonts/archivo-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:600;font-display:swap;src:url(fonts/archivo-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:700;font-display:swap;src:url(fonts/archivo-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Cairo";font-weight:400;font-display:swap;src:url(fonts/cairo-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:"Cairo";font-weight:600;font-display:swap;src:url(fonts/cairo-arabic-600-normal.woff2) format("woff2")}
@font-face{font-family:"Cairo";font-weight:700;font-display:swap;src:url(fonts/cairo-arabic-700-normal.woff2) format("woff2")}

/* Layout: clinical record app. Top bar + scrolling content + bottom navigation; max 880px on tablets. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --ink:#16211f; --muted:#5b6b68; --line:#d7dfdd;
  --accent:#12706b; --accent-ink:#ffffff; --soft:#e1f0ee; --bar:#0f2a2e; --bar-ink:#e8f1ef;
  --ok:#1d7f47; --warn:#a86a0f; --bad:#b8352a; --knee:#2f5fa8; --shoulder:#8a4fb5;
  --f-ui:"Cairo","Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Cairo","Archivo",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#151e1d; --ink:#e3ebe9; --muted:#95a6a2; --line:#27332f;
  --accent:#4fc0b6; --accent-ink:#06201d; --soft:#15302d; --bar:#0a1817; --bar-ink:#e3ebe9;
  --ok:#4cc27f; --warn:#e3a53c; --bad:#ef6f62; --knee:#7ea6e8; --shoulder:#c29ae6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#151e1d; --ink:#e3ebe9; --muted:#95a6a2; --line:#27332f;
  --accent:#4fc0b6; --accent-ink:#06201d; --soft:#15302d; --bar:#0a1817; --bar-ink:#e3ebe9;
  --ok:#4cc27f; --warn:#e3a53c; --bad:#ef6f62; --knee:#7ea6e8; --shoulder:#c29ae6; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[dir="rtl"],.ar{font-family:var(--f-ar)}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.top .ib{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:inherit;border-radius:9px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px}
.top .ib svg{width:18px;height:18px}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--accent)}
h2{font-size:19px;margin:4px 0 10px;letter-spacing:-.01em}
h3{font-size:13px;color:var(--muted);margin:18px 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;cursor:pointer;width:100%;text-align:start}
.item .m{flex:1;min-width:0}
.item .t{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{font-family:var(--f-num);font-size:12.5px;color:var(--muted);text-align:end;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;letter-spacing:.03em;white-space:nowrap;vertical-align:1px}
.tag.knee{color:var(--knee);background:color-mix(in srgb,var(--knee) 14%,transparent)}
.tag.shoulder{color:var(--shoulder);background:color-mix(in srgb,var(--shoulder) 14%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.tag.mut{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 10px;font-size:16px;color:var(--ink);font-weight:400}
textarea.in{min-height:84px;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tri{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tri button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;font-size:13px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.tri button b{font-family:var(--f-num);min-width:14px;text-align:center}
.tri button.pos{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.tri button.pos b{color:var(--bad)}
.tri button.neg{border-color:var(--ok)}
.tri button.neg b{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 12px;overflow-x:auto}
.tabs a{padding:9px 12px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.phead{display:flex;gap:12px;align-items:center}
.phead .av{width:52px;height:52px;font-size:19px}
.phead .n{font-size:19px;font-weight:700;line-height:1.2}
.phead .ar{font-size:16px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);font-family:var(--f-num)}
.tl{display:flex;flex-direction:column;gap:8px}
.tl .item{align-items:flex-start}
.tl .when{flex:none;font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:78px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.q{border-top:1px solid var(--line);padding:10px 0}
.q .ql{font-size:14px;font-weight:600;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:4px}
.opts label{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.opts label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.total{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.total .v{font-family:var(--f-num);font-size:22px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumbs figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.thumbs figcaption{font-size:12px;padding:6px 8px;color:var(--muted)}
.chart{width:100%;height:auto}
.chart text{font:11px var(--f-num);fill:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(3,8,7,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16211f;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.login{max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px;display:flex;flex-direction:column;gap:14px}
.login .logo{font-size:26px;font-weight:700;letter-spacing:-.02em}
.login .sub{color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* print sheet (rendered off-screen for PDF) */
#printRoot{position:fixed;left:-10000px;top:0}
.page{width:794px;min-height:1123px;background:#fff;color:#111;padding:48px 56px;font-family:"Archivo","Cairo",sans-serif;font-size:13.5px;line-height:1.5}
.page .lh{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #12706b;padding-bottom:12px;margin-bottom:14px}
.page .lh .en b{font-size:18px;display:block}
.page .lh .arb{text-align:right;font-family:"Cairo",sans-serif}
.page .lh .arb b{font-size:18px;display:block}
.page .pt{display:flex;flex-wrap:wrap;gap:6px 22px;background:#f1f6f5;border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:12.5px}
.page h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#12706b;margin:14px 0 4px}
.page .ttl{font-size:20px;font-weight:700;margin:0 0 6px}
.page table{width:100%;border-collapse:collapse;font-size:12.5px}
.page td,.page th{border-bottom:1px solid #dde5e3;padding:5px 6px;text-align:start;vertical-align:top}
.page .sig{margin-top:40px;display:flex;justify-content:space-between;font-size:12.5px}
.page .rtl{direction:rtl;text-align:right;font-family:"Cairo",sans-serif;font-size:15px;line-height:1.9}
.page .rx{font-size:34px;font-weight:700;color:#12706b;font-family:serif}
.page .foot{margin-top:24px;font-size:10.5px;color:#777;border-top:1px solid #ddd;padding-top:6px}

body{font-size:15.5px}
.nav a{font-size:12px}
.num{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:start}
.stat.cl{cursor:pointer;text-decoration:none;color:inherit;display:block}
.stat .v.sm{font-size:20px}
.queue .item{align-items:flex-start}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.st.booked{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.st.arrived{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st.in{color:var(--knee);background:color-mix(in srgb,var(--knee) 16%,transparent)}
.st.done{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.st.noshow,.st.cancelled{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.wa{background:#1fa855!important;color:#fff!important;border-color:#1fa855!important}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.slot{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:stretch}
.slot .tm{font-family:var(--f-num);font-size:13px;color:var(--muted);padding-top:12px;text-align:center}
.slot .free{border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--muted);font-size:13px;cursor:pointer;background:none;text-align:start;width:100%}
.ms{display:flex;flex-direction:column;gap:6px}
.ms .m1{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ms .m1 .d{width:12px;height:12px;border-radius:50%;flex:none;background:var(--line)}
.ms .m1.done .d{background:var(--ok)}.ms .m1.due .d{background:var(--warn)}.ms .m1.late .d{background:var(--bad)}
.ms .m1 .x{flex:1;min-width:0}
.money{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate;font-weight:600}
.money.pos{color:var(--ok)}.money.neg{color:var(--bad)}
.bal{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--soft);display:flex;justify-content:space-between;align-items:center}
.rec{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:14px}
.recbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(184,53,42,.35)}
.recbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(184,53,42,.15)}}
.timer{font-family:var(--f-num);font-size:26px;font-weight:600}
audio{width:100%;height:40px}
.scanbox{background:#000;border-radius:12px;overflow:hidden;position:relative}
.scanbox img,.scanbox canvas{width:100%;display:block}
.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.viewer .vb{display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:rgba(0,0,0,.6);color:#fff;align-items:center}
.viewer .vb b{flex:1;font-size:15px}
.viewer .vi{flex:1;overflow:auto;touch-action:pinch-zoom;display:flex;align-items:center;justify-content:center}
.viewer .vi img{max-width:100%;max-height:100%}
.viewer .vi.z img{max-width:none;max-height:none;width:200%}
.ocr{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:8px;padding:8px;max-height:220px;overflow:auto}
.drug{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.drug .dn{font-weight:700;direction:ltr;text-align:start}
.drug .dd{font-size:13px;color:var(--muted);grid-column:1}
.sug{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sug button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12.5px;cursor:pointer;direction:ltr}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .b{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px}
.bars .b .bar{height:10px}
.search{position:relative}
.search .in{padding-inline-start:36px}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.page{direction:rtl;font-family:"Cairo","Archivo",sans-serif}
.page .lh{flex-direction:row}
.page .rxl{direction:ltr;text-align:left;margin:6px 0 14px;padding:0 0 0 18px;list-style:none}
.page .rxl li{margin:0 0 14px;font-size:16px}
.page .rxl li .s{display:block;direction:rtl;text-align:left;color:#333;font-size:14.5px;padding-left:22px}
@media (min-width:900px){.nav{max-width:880px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="printRoot"></div>
<script src="config.js"></script>
<script src="lib.bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
