name: Voice model probe
on:
  push:
    branches: [main]
    paths: ['voice-probe/**', '.github/workflows/voice-probe.yml', 'voice-app/www/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-probe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Make speech samples
        run: |
          AR='المريض يشكو من ألم في الركبة اليمنى منذ ثلاثة أشهر بعد إصابة أثناء لعب كرة القدم. الفحص يظهر تورم بسيط وألم في الخط المفصلي الداخلي. نحتاج رنين مغناطيسي على الركبة.'
          EN='The patient complains of right knee pain for three months after a football injury. Examination shows mild effusion and medial joint line tenderness. We need an MRI of the knee.'
          (python3 -m pip install --user --break-system-packages gTTS==2.5.4 && python3 -c "from gtts import gTTS;import sys;gTTS(sys.argv[1],lang='ar').save('ar.mp3');gTTS(sys.argv[2],lang='en').save('en.mp3')" "$AR" "$EN" && echo TTS=gtts > tts.txt) || (sudo apt-get -qq install -y espeak-ng >/dev/null && espeak-ng -v ar -w ar.mp3 "$AR" && espeak-ng -v en -w en.mp3 "$EN" && echo TTS=espeak > tts.txt)
          which ffmpeg || (sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null)
          ffmpeg -loglevel error -y -i ar.mp3 -ar 16000 -ac 1 ar.wav
          ffmpeg -loglevel error -y -i en.mp3 -ar 16000 -ac 1 en.wav
          cat tts.txt
      - run: npm install
        if: always()
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser end-to-end test of the Voice Notes web app
        run: |
          sh ../voice-app/fetch-libs.sh
          cp ar.wav en.wav ../voice-app/www/ 2>/dev/null || true
          (cd ../voice-app/www && nohup python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 2
          node e2e.cjs || true
          cp e2e.txt probe.txt
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat tts.txt >> probe.txt || true
          gh release delete voice-probe --yes --cleanup-tag || true
          gh release create voice-probe probe.txt ar.wav en.wav --title "voice probe" --notes "CI probe output" --prerelease
