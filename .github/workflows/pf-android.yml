name: Build PF Planner Android app

on:
  push:
    branches: [main]
    paths: ['pf-app/**', '.github/workflows/pf-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pf-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: pf-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PFPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PFPlanner-apk
          path: pf-app/PFPlanner.apk
      - name: Publish to the "pf-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pf-latest --yes --cleanup-tag || true
          gh release create pf-latest PFPlanner.apk \
            --title "PF Instability Planner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download PFPlanner.apk, open it, allow installing from this source."
