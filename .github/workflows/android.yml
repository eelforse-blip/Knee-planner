name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || ls /usr/local/lib/android/sdk

      - name: Install
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OsteotomyPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OsteotomyPlanner-apk
          path: OsteotomyPlanner.apk

      - name: Publish to the "latest" release (download from your phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OsteotomyPlanner.apk \
            --title "Osteotomy Planner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download OsteotomyPlanner.apk, open it, allow installing from this source."
