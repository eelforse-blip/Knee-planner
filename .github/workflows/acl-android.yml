name: Build ACL Planner Android app

on:
  push:
    branches: [main]
    paths: ['acl-app/**', '.github/workflows/acl-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acl-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: acl-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ACLPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ACLPlanner-apk
          path: acl-app/ACLPlanner.apk
      - name: Publish to the "acl-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete acl-latest --yes --cleanup-tag || true
          gh release create acl-latest ACLPlanner.apk \
            --title "ACL Decision Planner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download ACLPlanner.apk, open it, allow installing from this source."
