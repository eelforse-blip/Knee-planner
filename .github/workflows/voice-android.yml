name: Build Voice Notes Android app

on:
  push:
    branches: [main]
    paths: ['voice-app/**', '.github/workflows/voice-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Fetch speech library
        run: sh fetch-libs.sh
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: voice-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VoiceNotes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-apk
          path: voice-app/VoiceNotes.apk
      - name: Publish to the "voice-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete voice-latest --yes --cleanup-tag || true
          gh release create voice-latest VoiceNotes.apk \
            --title "Voice Notes (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download VoiceNotes.apk, open it, allow installing from this source."
