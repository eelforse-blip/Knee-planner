name: Publish web app (iPhone / any phone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Assemble site (knee app at root, PF app at /pf/)
        run: |
          mkdir site
          cp -r www/. site/
          mkdir site/pf
          cp -r pf-app/www/. site/pf/
          mkdir site/clinic
          cp -r clinic-app/www/. site/clinic/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
