name: Build Meniscus Planner Android app

on:
  push:
    branches: [main]
    paths: ['meniscus-app/**', '.github/workflows/meniscus-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meniscus-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: meniscus-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MeniscusPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeniscusPlanner-apk
          path: meniscus-app/MeniscusPlanner.apk
      - name: Publish to the "meniscus-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete meniscus-latest --yes --cleanup-tag || true
          gh release create meniscus-latest MeniscusPlanner.apk \
            --title "Meniscus Decision Planner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download MeniscusPlanner.apk, open it, allow installing from this source."
