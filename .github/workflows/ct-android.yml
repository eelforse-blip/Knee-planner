name: Build CT Viewer Android app

on:
  push:
    branches: [main]
    paths: ['ct-app/**', '.github/workflows/ct-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ct-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: ct-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CTViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CTViewer-apk
          path: ct-app/CTViewer.apk
      - name: Publish to the "ct-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ct-latest --yes --cleanup-tag || true
          gh release create ct-latest CTViewer.apk \
            --title "CT Viewer (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download CTViewer.apk, open it, allow installing from this source."
