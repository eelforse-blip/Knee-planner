name: Build Bone Tumour Planner Android app

on:
  push:
    branches: [main]
    paths: ['tumour-app/**', '.github/workflows/tumour-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tumour-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: tumour-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BoneTumourPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BoneTumourPlanner-apk
          path: tumour-app/BoneTumourPlanner.apk
      - name: Publish to the "tumour-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete tumour-latest --yes --cleanup-tag || true
          gh release create tumour-latest BoneTumourPlanner.apk \
            --title "Bone Tumour Planner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download BoneTumourPlanner.apk, open it, allow installing from this source."
